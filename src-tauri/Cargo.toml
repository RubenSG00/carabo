[package]
name = "carabo"
edition.workspace = true
license.workspace = true

[lib]
name = "carabo_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
carabo-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
